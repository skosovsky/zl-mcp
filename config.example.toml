state_dir = "./state"
[collection]
# all: collect accessible direct chats and groups, including newly discovered ones
mode = "all"
# For a restricted installation use mode = "selected" and conversations = []
# Example entry: { type = "direct", id = "PEER_ID" }
# Do not combine mode/conversations with legacy group_ids.
[permissions]
allow_join = false
allow_send = false
# Optional restriction when allow_send = true; empty/omitted permits any peer ID.
# send_recipient_ids = ["PEER_ID"]
[storage]
retention_days = 90
[logging]
level = "info"
# service only; default file: ~/Library/Logs/zl-mcp/service.log
max_size_mb = 5
max_backups = 3
[mcp]
listen = "127.0.0.1:18765"
# token_file defaults to state_dir/mcp-token; generated privately on first service start
