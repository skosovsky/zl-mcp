name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check generated MCP reference and negative controls
        run: |
          python3 scripts/reference/reference.py --check
          python3 -m unittest discover -s scripts/reference -p 'test_*.py'
      - name: Validate distributable plugin and negative controls
        run: |
          python3 -m venv "$RUNNER_TEMP/zl-plugin-tools"
          "$RUNNER_TEMP/zl-plugin-tools/bin/pip" install -r scripts/plugin/requirements.txt
          "$RUNNER_TEMP/zl-plugin-tools/bin/python" scripts/plugin/package.py --check
          "$RUNNER_TEMP/zl-plugin-tools/bin/python" -m unittest discover -s scripts/plugin -p 'test_*.py'
          "$RUNNER_TEMP/zl-plugin-tools/bin/python" scripts/plugin/package.py --output "$RUNNER_TEMP/zl-mcp-plugin.zip"
      - name: Upload public plugin package
        uses: actions/upload-artifact@v4
        with:
          name: zl-mcp-plugin-${{ matrix.os }}
          path: ${{ runner.temp }}/zl-mcp-plugin.zip
      - name: Install pinned golangci-lint
        run: GOBIN="$(go env GOPATH)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint both modules without autofix
        run: make lint
      - name: Check architectural boundaries and negative controls
        run: make architecture
      - name: Run mandatory synthetic offline evaluation
        run: make eval-offline
      - name: Test Go architecture tooling
        run: make tools-test tools-race tools-vet
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Test patched zcago module
        working-directory: third_party/zcago
        run: go test ./...
      - name: Race-check patched zcago module
        working-directory: third_party/zcago
        run: go test -race ./...
      - name: Vet patched zcago module
        working-directory: third_party/zcago
        run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o bin/zl-mcp-darwin-arm64 ./cmd/zl-mcp
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o bin/zl-mcp-darwin-amd64 ./cmd/zl-mcp
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/zl-mcp-linux-amd64 ./cmd/zl-mcp
      - name: Build native service acceptance binary
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/zl-mcp-native" ./cmd/zl-mcp
      - name: Build same-source replacement candidate
        run: CGO_ENABLED=0 go build -trimpath -ldflags=-w -o "$RUNNER_TEMP/zl-mcp-upgrade" ./cmd/zl-mcp
      - name: Check native service startup cleanup
        env:
          ZL_MCP_ACCEPTANCE_BINARY: ${{ runner.temp }}/zl-mcp-native
        run: go test -race ./internal/mobilebackup -run '^TestNativeBinaryTerminalStartupAcceptance$' -count=1
      - name: Check native per-account service isolation and shared binary replacement
        env:
          ZL_MCP_ACCEPTANCE_BINARY: ${{ runner.temp }}/zl-mcp-native
          ZL_MCP_UPGRADE_BINARY: ${{ runner.temp }}/zl-mcp-upgrade
        run: go test -race ./internal/service -run '^TestNativePlugin(InstanceIsolation|SharedBinaryReplacement)$' -count=1
